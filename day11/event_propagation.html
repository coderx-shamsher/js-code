<!-- capturing (top down) -->

<script>

// 3rd parameter = true for capturing
document.getElementById('parent').addEventListener('click', () => {
    console.log('Parent CAPTURED');
}, true); // Capture phase

document.getElementById('child').addEventListener('click', () => {
    console.log('Child clicked!');
}, );

// also change the value of evnet function boolean value like true and false 
</script>
<!-- now first parent captured hoga then child clicked console hoga .. hamne callback function k bad ek boolen value dente hai jo ki true hoti hai in jaise ki mein mere first event function mein pass kri hai
